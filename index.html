<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#011733" />
    <meta
      name="description"
      content="Entre Colunas — gestão de membros e finanças da sua loja."
    />
    <link rel="icon" href="/pwa-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Entre Colunas</title>
    <script src="/startup.js"></script>
    <link rel="stylesheet" href="/startup.css" />
  </head>
  <body>
    <div id="app">
      <div class="boot" role="status" aria-label="Preparando aplicativo">
        <span class="boot-sr">Preparando aplicativo</span>
        <div aria-hidden="true">
          <div class="boot-brand">
            <img src="/pwa-192.png" alt="" /><strong>Entre Colunas</strong>
          </div>
          <div class="boot-content">
            <span class="boot-bar boot-title"></span>
            <div class="boot-grid">
              <div class="boot-card">
                <span class="boot-bar"></span
                ><span class="boot-bar boot-value"></span>
              </div>
              <div class="boot-card">
                <span class="boot-bar"></span
                ><span class="boot-bar boot-value"></span>
              </div>
              <div class="boot-card">
                <span class="boot-bar"></span
                ><span class="boot-bar boot-value"></span>
              </div>
            </div>
            <div class="boot-rows">
              <div class="boot-row">
                <span class="boot-circle"></span>
                <div class="boot-copy">
                  <span class="boot-bar"></span><span class="boot-bar"></span>
                </div>
              </div>
              <div class="boot-row">
                <span class="boot-circle"></span>
                <div class="boot-copy">
                  <span class="boot-bar"></span><span class="boot-bar"></span>
                </div>
              </div>
              <div class="boot-row">
                <span class="boot-circle"></span>
                <div class="boot-copy">
                  <span class="boot-bar"></span><span class="boot-bar"></span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <noscript>Ative o JavaScript para acessar o Entre Colunas.</noscript>
    </div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
